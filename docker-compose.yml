services:
  postgres:
    image: postgres:16-alpine
    container_name: subflow-postgres
    environment:
      POSTGRES_DB: subflow
      POSTGRES_USER: subflow
      POSTGRES_PASSWORD: subflow
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - subflow-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subflow -d subflow"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: subflow-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - subflow-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  subflow-pg-data:
  subflow-redis-data:
