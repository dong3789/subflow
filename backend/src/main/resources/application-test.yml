# 테스트 프로파일: 외부 인프라 없이 도는 단위·슬라이스 테스트용.
# PostgreSQL 전용 문법(JSONB, 부분 인덱스)은 Flyway를 끄고 Hibernate ddl-auto로 대체한다.
spring:
  datasource:
    url: jdbc:h2:mem:subflow-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: false

  flyway:
    enabled: false

  data:
    redis:
      host: localhost
      port: 6379

subflow:
  version: test
  dunning:
    max-retries: 3
    retry-interval: 1h
  outbox:
    batch-size: 20
    max-retries: 3
    retry-backoff: 1s
  lock:
    key-prefix: "subflow:test:lock:"
    lease-time: 1s
    wait-time: 1s
  webhook:
    timestamp-tolerance: 5m

logging:
  level:
    com.subflow: WARN
